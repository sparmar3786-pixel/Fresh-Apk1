name: Build Fresh APK1 Android APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresh-apk1-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: flutter_app/pubspec.lock

      - name: Generate Android platform files if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name fresh_algo_signal .
          fi

      - name: Ensure Android network permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET"/>\\n'
          if "android.permission.INTERNET" not in s:
              match = re.search(r"<manifest\\b[^>]*>", s, flags=re.DOTALL)
              if not match:
                  raise SystemExit("AndroidManifest.xml has no valid <manifest ...> root tag")
              s = s[:match.end()] + "\\n" + permission + s[match.end():]
              p.write_text(s)
          # Fail early with a clear message if the manifest is malformed.
          import xml.etree.ElementTree as ET
          ET.parse(p)
          print("AndroidManifest.xml is valid XML and INTERNET permission is present.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: >-
          flutter build apk --release --no-tree-shake-icons
          --dart-define=BACKEND_URL=https://fresh-algo-signal-gateway-v2.onrender.com

      - name: Verify APK exists
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fresh-apk1-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
