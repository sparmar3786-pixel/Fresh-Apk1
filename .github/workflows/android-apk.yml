name: Build Fresh APK1 Android APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresh-apk1-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # Install Flutter directly so repository action policy does not reject
      # an unpinned nested actions/cache dependency in flutter-action.
      - name: Install Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Generate Android platform files if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name fresh_algo_signal .
          fi

      - name: Set Android SDK levels for Qwen and current plugins
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Could not find android/app/build.gradle(.kts)")
          source = gradle.read_text()

          def replace_version(text, name, value, patterns):
              for pattern in patterns:
                  updated, count = re.subn(pattern, lambda m: m.group(1) + value + m.group(2), text, count=1)
                  if count:
                      print(f"Set {name} to {value}")
                      return updated
              raise SystemExit(f"Could not safely set {name} in {gradle}")

          source = replace_version(source, "minSdk", "26", [
              r"(?m)^(\s*minSdk\s*=\s*)[^\s]+(\s*(?://.*)?)$",
              r"(?m)^(\s*minSdk\s+)[^\s]+(\s*(?://.*)?)$",
              r"(?m)^(\s*minSdkVersion\s*=\s*)[^\s]+(\s*(?://.*)?)$",
              r"(?m)^(\s*minSdkVersion\s+)[^\s]+(\s*(?://.*)?)$",
              r"(?m)^(\s*minSdkVersion\(\s*)[0-9]+(\s*\)\s*(?://.*)?)$",
          ])
          source = replace_version(source, "compileSdk", "36", [
              r"(?m)^(\s*compileSdk\s*=\s*)[^\s]+(\s*(?://.*)?)$",
              r"(?m)^(\s*compileSdk\s+)[^\s]+(\s*(?://.*)?)$",
              r"(?m)^(\s*compileSdkVersion\s*=\s*)[^\s]+(\s*(?://.*)?)$",
              r"(?m)^(\s*compileSdkVersion\s+)[^\s]+(\s*(?://.*)?)$",
              r"(?m)^(\s*compileSdkVersion\(\s*)[0-9]+(\s*\)\s*(?://.*)?)$",
          ])
          gradle.write_text(source)
          print("Updated Android SDK levels in", gradle)
          PY

      - name: Enable core library desugaring for notifications
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Could not find android/app/build.gradle(.kts)")
          s = gradle.read_text()
          kotlin_dsl = gradle.suffix == ".kts"

          # Enable Java 8+ API desugaring inside compileOptions.
          if "isCoreLibraryDesugaringEnabled" not in s and "coreLibraryDesugaringEnabled" not in s:
              pattern = r"(compileOptions\s*\{)"
              replacement = r"\1\n        " + ("isCoreLibraryDesugaringEnabled = true" if kotlin_dsl else "coreLibraryDesugaringEnabled true")
              s, count = re.subn(pattern, replacement, s, count=1)
              if count != 1:
                  raise SystemExit("Could not find compileOptions block to enable desugaring")

          # Add the required desugar library, creating a dependencies block
          # when the generated Flutter Kotlin DSL template has none.
          if "desugar_jdk_libs" not in s:
              dependency = ('    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                            if kotlin_dsl else
                            "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")
              pattern = r"(dependencies\s*\{)"
              s, count = re.subn(pattern, lambda m: m.group(1) + "\n" + dependency, s, count=1)
              if count == 0:
                  if kotlin_dsl:
                      s = s.rstrip() + "\n\ndependencies {\n" + dependency + "\n}\n"
                  else:
                      s = s.rstrip() + "\n\ndependencies {\n" + dependency + "\n}\n"
          gradle.write_text(s)
          print(f"Enabled core library desugaring in {gradle}")
          PY

      - name: Ensure Android network and notification permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
          ]
          match = re.search(r"<manifest\b[^>]*>", s, flags=re.DOTALL)
          if not match:
              raise SystemExit("AndroidManifest.xml has no valid <manifest ...> root tag")
          missing = [line for line in permissions if line.split('"')[1] not in s]
          if missing:
              s = s[:match.end()] + "\n" + "\n".join(missing) + s[match.end():]
              p.write_text(s)
          import xml.etree.ElementTree as ET
          ET.parse(p)
          print("AndroidManifest.xml is valid XML and permissions are present.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Raise file_picker Android plugin compileSdk to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          files = list(cache.glob("file_picker-*/android/build.gradle")) + list(cache.glob("file_picker-*/android/build.gradle.kts"))
          if not files:
              raise SystemExit("file_picker Android Gradle file not found in pub cache")
          patterns = [
              r"(?m)^(\\s*compileSdk\\s*=\\s*)[^\\s]+(\\s*(?://.*)?)$",
              r"(?m)^(\\s*compileSdk\\s+)[^\\s]+(\\s*(?://.*)?)$",
              r"(?m)^(\\s*compileSdkVersion\\s*=\\s*)[^\\s]+(\\s*(?://.*)?)$",
              r"(?m)^(\\s*compileSdkVersion\\s+)[^\\s]+(\\s*(?://.*)?)$",
          ]
          changed = []
          for path in files:
              source = path.read_text()
              updated = source
              for pattern in patterns:
                  updated, count = re.subn(pattern, lambda m: m.group(1) + "36" + m.group(2), updated, count=1)
                  if count:
                      break
              if updated == source:
                  if re.search(r"(?m)^\\s*compileSdk(?:Version)?\\s*(?:=\\s*)?36\\b", source):
                      continue
                  raise SystemExit("Could not safely raise compileSdk in " + str(path))
              path.write_text(updated)
              changed.append(str(path))
          if not changed:
              raise SystemExit("file_picker compileSdk already 36; expected to patch SDK-34 metadata")
          print("Raised file_picker compileSdk to 36:", ", ".join(changed))
          PY

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Validate Railway backend URL
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://nse-algo-backend-final-production.up.railway.app' }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          value = os.environ.get('BACKEND_URL', '').strip().rstrip('/')
          parsed = urlparse(value)
          if parsed.scheme != 'https' or not parsed.netloc:
              raise SystemExit('Set GitHub Actions repository variable BACKEND_URL to the new Railway public HTTPS domain before building. Example: https://your-service.up.railway.app')
          print('Configured backend:', value)
          PY

      - name: Build release APK
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://nse-algo-backend-final-production.up.railway.app' }}
        run: >-
          flutter build apk --release --no-tree-shake-icons
          --dart-define=BACKEND_URL=${BACKEND_URL}

      - name: Verify APK exists
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fresh-apk1-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
